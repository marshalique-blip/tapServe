<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15140F">
<title>Kitchen sign in · tap+serve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --butta: #FFE17A;
    --butta-deep: #FFD43B;
    --navy: #0B2545;
    --ink: #15140F;
    --panel: #1E1D18;
    --panel-2: #25231C;
    --line: #2F2D24;
    --text: #FAF7F0;
    --muted: #A9A38C;
    --late: #FF5A4D;
    --ready: #3DDC84;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--ink);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    overflow-x: hidden;
    position: relative;
  }

  /* One quiet butta glow behind the card */
  body::before {
    content: '';
    position: fixed;
    top: -20vmax; left: 50%;
    width: 70vmax; height: 70vmax;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(255, 225, 122, .14), rgba(255, 225, 122, 0) 70%);
    pointer-events: none;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 400px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 40px 32px 32px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
  }

  .logo {
    height: 56px;
    width: auto;
    max-width: 180px;
    object-fit: contain;
    margin: 0 auto 14px;
    display: block;
  }

  
  .subtitle {
    margin-top: 6px;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
  }

  form { margin-top: 32px; }

  .pin-label {
    display: block;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 14px;
  }

  /* PIN: four slots over one real input */
  .pin-wrap {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 12px;
    cursor: text;
  }

  .slot {
    width: 58px;
    height: 68px;
    border-radius: 16px;
    background: var(--panel-2);
    border: 2px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .15s, background .15s;
  }

  .slot::after {
    content: '';
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--butta);
    transform: scale(0);
    transition: transform .12s ease-out;
  }

  .slot.filled::after { transform: scale(1); }
  .pin-wrap.focused .slot.current { border-color: var(--butta); background: #2B2920; }

  /* Real input sits on top, invisible, so keyboard, paste and mobile numpad all work */
  .pin-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    font-size: 16px; /* prevents iOS zoom */
    border: 0;
    background: transparent;
    color: transparent;
    caret-color: transparent;
    cursor: text;
  }

  .submit {
    width: 100%;
    margin-top: 28px;
    padding: 18px;
    border: 0;
    border-radius: 16px;
    background: var(--butta);
    color: var(--ink);
    font: inherit;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    transition: background .15s, transform .08s;
    min-height: 56px;
  }
  .submit:hover { background: var(--butta-deep); }
  .submit:active { transform: scale(.98); }
  .submit:disabled { opacity: .6; cursor: default; }

  :focus-visible { outline: 3px solid var(--butta); outline-offset: 3px; }
  .pin-input:focus-visible { outline: none; }

  .error {
    min-height: 44px;
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(255, 90, 77, .12);
    color: #FF8A80;
    font-size: 14px;
    font-weight: 700;
    visibility: hidden;
  }
  .error.show { visibility: visible; }

  .card.shake { animation: shake .45s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  /* Success */
  .success {
    display: none;
    text-align: center;
  }
  .card.done form, .card.done .error { display: none; }
  .card.done .success { display: block; margin-top: 32px; }
  .check {
    width: 72px; height: 72px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--ready);
    color: var(--ink);
    font-size: 36px;
    font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    animation: pop .4s ease-out;
  }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .success p { font-size: 20px; font-weight: 800; }
  .success small { display: block; margin-top: 4px; color: var(--muted); font-size: 14px; font-weight: 600; }

  @media (max-width: 380px) {
    .card { padding: 32px 20px 24px; }
    .slot { width: 52px; height: 62px; }
    .pin-wrap { gap: 10px; }
  }

  @media (max-height: 520px) and (orientation: landscape) {
    body { align-items: flex-start; }
    .card { padding: 20px; margin: 8px auto; }
    .logo { height: 36px; margin-bottom: 8px; }
    form { margin-top: 16px; }
    .submit { margin-top: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card.shake, .check { animation: none; }
    .slot::after, .slot, .submit { transition: none; }
  }
</style>
</head>
<body>

<main class="card" id="card">
  <img class="logo" id="logo" alt="butta">
  <p class="subtitle">Kitchen display</p>

  <form id="loginForm" autocomplete="off" novalidate>
    <label class="pin-label" for="pin">Enter your PIN</label>

    <div class="pin-wrap" id="pinWrap">
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <input
        id="pin"
        class="pin-input"
        type="password"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="4"
        autocomplete="off"
        enterkeyhint="go"
        aria-describedby="pinError">
    </div>

    <div class="error" id="pinError" role="alert" aria-live="assertive">That PIN isn’t right. Try again.</div>

    <button type="submit" class="submit" id="loginButton">Sign in</button>
  </form>

  <div class="success" id="success" role="status">
    <div class="check">✓</div>
    <p>You’re in</p>
    <small>Opening the kitchen display…</small>
  </div>
</main>

<script>
// ============================================
// CONFIGURATION
// ============================================
const CONFIG = {
    // Relative paths keep everything on whichever address the page was opened from
    // (www or not), so the API call, logo and saved sign-in all share one origin.
    SERVER: '',
    SESSION_HOURS: 8,
    REDIRECT_URL: '/new-kds-order.html'
};

// Logo lives in the server's public folder (public/butta_gold.png)
document.getElementById('logo').src = CONFIG.SERVER + '/butta_gold.png';
document.getElementById('logo').addEventListener('error', function () { this.style.display = 'none'; });

const SESSION_DURATION = CONFIG.SESSION_HOURS * 60 * 60 * 1000;

const card = document.getElementById('card');
const form = document.getElementById('loginForm');
const pinInput = document.getElementById('pin');
const pinWrap = document.getElementById('pinWrap');
const errorEl = document.getElementById('pinError');
const slots = Array.from(document.querySelectorAll('.slot'));

// ============================================
// AUTH
// ============================================
function checkAuth() {
    const authData = localStorage.getItem('kds_auth');
    if (!authData) return false;
    try {
        const parsed = JSON.parse(authData);
        if (Date.now() - parsed.timestamp > SESSION_DURATION) {
            localStorage.removeItem('kds_auth');
            return false;
        }
        return parsed.authenticated === true;
    } catch (e) {
        localStorage.removeItem('kds_auth');
        return false;
    }
}

let busy = false;

function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('show');
    pinInput.value = '';
    paintSlots();
    pinInput.focus();
    card.classList.remove('shake');
    void card.offsetWidth; // restart animation
    card.classList.add('shake');
}

async function handleLogin() {
    if (busy) return;
    const entered = pinInput.value.trim();
    if (entered.length < 4) { showError('Enter all 4 digits.'); return; }

    busy = true;
    const btn = document.getElementById('loginButton');
    btn.disabled = true;
    btn.textContent = 'Checking…';

    try {
        const res = await fetch(CONFIG.SERVER + '/api/kds/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: entered })
        });
        const data = await res.json().catch(() => ({}));

        if (res.ok && data.token) {
            localStorage.setItem('kds_auth', JSON.stringify({
                authenticated: true,
                timestamp: Date.now(),
                token: data.token,
                user: data.label || 'Kitchen Staff'
            }));
            errorEl.classList.remove('show');
            card.classList.add('done');
            setTimeout(() => { window.location.href = CONFIG.REDIRECT_URL; }, 900);
            return; // leave the button disabled while redirecting
        }

        showError(res.status === 401 ? 'That PIN isn’t right. Try again.' : (data.error || 'Something went wrong. Try again.'));
    } catch (err) {
        showError('Can’t reach the server. Check the connection and try again.');
    }

    busy = false;
    btn.disabled = false;
    btn.textContent = 'Sign in';
}

// ============================================
// PIN SLOTS
// ============================================
function paintSlots() {
    const len = pinInput.value.length;
    slots.forEach((s, i) => {
        s.classList.toggle('filled', i < len);
        s.classList.toggle('current', i === Math.min(len, slots.length - 1));
    });
}

pinInput.addEventListener('input', () => {
    pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4);
    errorEl.classList.remove('show');
    paintSlots();
});
pinInput.addEventListener('focus', () => { pinWrap.classList.add('focused'); paintSlots(); });
pinInput.addEventListener('blur', () => pinWrap.classList.remove('focused'));

// ============================================
// SUBMIT: button click AND Enter key both fire the form's submit event
// ============================================
form.addEventListener('submit', (e) => {
    e.preventDefault();
    handleLogin();
});

// ============================================
// INIT
// ============================================
window.addEventListener('DOMContentLoaded', () => {
    if (checkAuth()) {
        window.location.replace(CONFIG.REDIRECT_URL);
        return;
    }
    paintSlots();
    // Autofocus on desktop only; on tablets/phones wait for a tap so the keyboard doesn't jump up
    if (!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        setTimeout(() => pinInput.focus(), 200);
    }
});
</script>

</body>
</html>
